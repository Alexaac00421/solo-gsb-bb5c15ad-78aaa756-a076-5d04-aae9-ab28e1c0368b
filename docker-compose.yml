services:
  db:
    image: postgres:16-alpine
    container_name: expo-gate-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expo}
      POSTGRES_DB: ${POSTGRES_DB:-expo}
    ports:
      # 仅为方便本地调试；生产可去掉该映射
      - "${POSTGRES_PORT_PUBLISH:-5432}:5432"
    volumes:
      - expo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expo} -d ${POSTGRES_DB:-expo}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: expo-gate-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-expo}:${POSTGRES_PASSWORD:-expo}@db:5432/${POSTGRES_DB:-expo}
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      DB_STARTUP_WAIT: "60"
      MAX_BATCH_SIZE: "2000"
    ports:
      - "${APP_PORT_PUBLISH:-8080}:8080"

volumes:
  expo_pgdata:
