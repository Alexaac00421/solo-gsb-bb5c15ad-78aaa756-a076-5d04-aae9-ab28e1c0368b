services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gate}
      POSTGRES_DB: ${POSTGRES_DB:-gate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gate}:${POSTGRES_PASSWORD:-gate}@db:5432/${POSTGRES_DB:-gate}
      POOL_MAX_SIZE: ${POOL_MAX_SIZE:-10}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
